<style>
:root{
  --ink:#F7F3EC; --ink-2:#EFE8DA; --bone:#3A2E22; --bone-dim:#473A2B;
  --champagne:#C9A24B; --champagne-lt:#A9803F; --stone:#6E6250;
  --stage:#14110D; --hair:rgba(247,243,236,.16);
  /* 後備鏈：Google Fonts 載不到時（離線／被擋）仍要有像樣的中文襯線 */
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --disp:"Cormorant Garamond","Baskerville","Georgia","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--stage); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}

/* ---------- 版面 ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 64px}
.pagehead{text-align:center;margin:8px 0 22px}
.pagehead .mark{display:block;margin:0 auto 14px}
.pagehead h1{
  font-family:var(--serif);font-weight:600;font-size:clamp(20px,2.6vw,30px);
  letter-spacing:.06em;margin:0 0 6px;color:var(--ink)
}
.pagehead p{margin:0;color:var(--stone);font-size:14px;letter-spacing:.04em}
.pagehead p b{color:var(--champagne);font-weight:500}

/* ---------- 片單選擇 ---------- */
.films{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 16px}
.films button{
  font-family:var(--sans);font-size:13.5px;letter-spacing:.05em;
  color:var(--ink-2);background:transparent;
  border:1px solid var(--hair);border-radius:999px;
  padding:9px 18px;cursor:pointer;transition:.25s;
}
.films button:hover{border-color:var(--champagne);color:#fff}
.films button[aria-selected="true"]{
  background:var(--champagne);border-color:var(--champagne);color:#1A1712;font-weight:500
}

/* ---------- 舞台 ---------- */
.stage{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#0d0b08;border:1px solid var(--hair);border-radius:4px;
  overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);
  cursor:pointer;
}
#shots{position:absolute;inset:0;z-index:1}   /* 自成堆疊脈絡：鏡頭永遠在壓暗漸層(z:3)之下 */
#caps{position:absolute;inset:0;z-index:5;pointer-events:none}
.shot{position:absolute;inset:0;opacity:0;will-change:opacity}
.shot img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;will-change:transform;transform-origin:center
}
/* 讓文字永遠讀得到的漸層壓底 */
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:
    linear-gradient(to top,rgba(10,8,6,.80) 0%,rgba(10,8,6,.30) 26%,rgba(10,8,6,0) 52%),
    linear-gradient(to bottom,rgba(10,8,6,.42) 0%,rgba(10,8,6,0) 26%);
}

/* 片頭/片尾 品牌卡 */
.card{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(120% 90% at 50% 40%,#241d15 0%,#14110D 62%,#0d0b08 100%);
}
.card .cmark{margin-bottom:20px}
.card h2{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3.4vw,40px);letter-spacing:.14em;margin:0 0 10px}
.card .en{font-family:var(--disp);font-size:clamp(13px,1.5vw,18px);letter-spacing:.42em;color:var(--champagne);margin:0 0 26px;text-transform:uppercase}
.card .lines{font-size:clamp(11.5px,1.35vw,14.5px);line-height:2.1;color:var(--ink-2);letter-spacing:.05em}
.card .lines b{color:var(--champagne);font-weight:500}
.card .rule{width:52px;height:1px;background:var(--champagne);opacity:.6;margin:18px auto}

/* ---------- 字卡 ---------- */
.cap{
  position:absolute;z-index:5;max-width:min(78%,720px);
  opacity:0;pointer-events:none;
  text-shadow:0 2px 24px rgba(0,0,0,.75),0 1px 4px rgba(0,0,0,.6);
}
.cap.bl{left:clamp(20px,4.2%,54px);bottom:clamp(46px,10%,90px);text-align:left}
.cap.br{right:clamp(20px,4.2%,54px);bottom:clamp(46px,10%,90px);text-align:right}
.cap.cc{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:min(86%,820px)}
.cap .eyebrow{
  font-family:var(--sans);font-weight:500;
  font-size:clamp(9.5px,1.05vw,12.5px);letter-spacing:.38em;
  color:var(--champagne);margin:0 0 12px;text-transform:uppercase
}
.cap .t{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(19px,3.1vw,40px);line-height:1.34;letter-spacing:.045em;
  margin:0;color:#fff
}
.cap .s{
  font-family:var(--sans);font-weight:300;
  font-size:clamp(11.5px,1.45vw,17px);line-height:1.85;letter-spacing:.06em;
  margin:12px 0 0;color:var(--ink-2)
}
.cap .s b{color:var(--champagne);font-weight:500}
.cap .hair{width:38px;height:1px;background:var(--champagne);margin:14px 0 0;opacity:.75}
.cap.br .hair{margin-left:auto}
.cap.cc .hair{margin-left:auto;margin-right:auto}

/* 常駐浮水印 */
.wm{
  position:absolute;z-index:6;left:clamp(18px,3.6%,46px);top:clamp(16px,3.4%,40px);
  display:flex;align-items:center;gap:9px;opacity:.72
}
.wm span{font-family:var(--disp);font-size:clamp(10px,1.15vw,13px);letter-spacing:.3em;color:var(--ink-2);text-transform:uppercase}

/* ---------- 控制列 ---------- */
.bar{
  position:absolute;z-index:8;left:0;right:0;bottom:0;
  display:flex;align-items:center;gap:14px;
  padding:12px clamp(14px,2.6%,26px) 13px;
  background:linear-gradient(to top,rgba(8,6,4,.86),rgba(8,6,4,0));
  opacity:0;transition:opacity .3s
}
.stage:hover .bar,.stage.paused .bar,.stage.touch .bar{opacity:1}
.bar button{
  background:none;border:0;color:var(--ink);cursor:pointer;
  padding:4px;display:flex;align-items:center;line-height:0;opacity:.9;transition:.2s
}
.bar button:hover{opacity:1;color:var(--champagne)}
.track{
  flex:1;height:3px;background:rgba(247,243,236,.22);border-radius:2px;
  position:relative;cursor:pointer
}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--champagne);border-radius:2px;width:0}
.time{font-family:var(--disp);font-size:12.5px;letter-spacing:.12em;color:var(--ink-2);min-width:78px;text-align:right}

/* 大播放鍵 */
.big{
  position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);
  width:76px;height:76px;border-radius:50%;
  border:1px solid rgba(247,243,236,.5);background:rgba(12,9,7,.42);
  backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;cursor:pointer;transition:.25s
}
.stage.paused .big{display:flex}
.big:hover{background:var(--champagne);border-color:var(--champagne)}
.big svg{margin-left:4px}
.big:hover svg{color:#1A1712}

/* ---------- 影片下方說明 ---------- */
.note{
  margin:18px auto 0;max-width:820px;text-align:center;
  font-size:13px;line-height:2;color:var(--stone);letter-spacing:.04em
}
.note b{color:var(--ink-2);font-weight:400}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 0}
.cta a{
  font-size:13.5px;letter-spacing:.06em;text-decoration:none;padding:11px 24px;border-radius:999px;
  border:1px solid var(--champagne);color:var(--champagne);transition:.25s
}
.cta a.solid{background:var(--champagne);color:#1A1712;font-weight:500}
.cta a:hover{background:var(--champagne);color:#1A1712}


/* ---------- 口白字幕 ---------- */
#sub{
  position:absolute;z-index:6;left:50%;transform:translateX(-50%);
  bottom:clamp(44px,8.4%,74px);width:min(88%,860px);text-align:center;
  opacity:0;transition:opacity .3s;pointer-events:none
}
#sub span{
  display:inline-block;
  font-family:var(--sans);font-weight:400;
  font-size:clamp(12px,1.5vw,18px);line-height:1.7;letter-spacing:.05em;
  color:#fff;background:rgba(10,8,6,.52);
  padding:6px 16px;border-radius:3px;
  text-shadow:0 1px 8px rgba(0,0,0,.8)
}
#sub.on{opacity:1}
/* 有字幕時，字卡整體往上讓位 */
.stage.has-sub .cap.bl,.stage.has-sub .cap.br{bottom:clamp(92px,18%,158px)}


@media (max-width:640px){
  /* 手機改 4:3：素材本來就是 3:2 / 4:3，少裁切且畫面大得多 */
  .stage{aspect-ratio:4/3}

  .stage.has-sub .cap.bl,.stage.has-sub .cap.br{bottom:86px}

  .wrap{padding:18px 12px 44px}
  .cap.bl,.cap.br{bottom:58px;max-width:86%}
  .bar{gap:10px}
  .time{min-width:66px;font-size:11.5px}
  .big{width:60px;height:60px}
}
@media (prefers-reduced-motion:reduce){
  .shot img{transition:none!important}
}

/* ---------------- 引擎 ---------------- */
var KB = {
  "in":   [{s:1.03,x:0,y:0},   {s:1.19,x:0,y:0}],
  "out":  [{s:1.19,x:0,y:0},   {s:1.03,x:0,y:0}],
  "panR": [{s:1.16,x:3.6,y:0}, {s:1.10,x:-3.6,y:0}],
  "panL": [{s:1.16,x:-3.6,y:0},{s:1.10,x:3.6,y:0}],
  "tiltU":[{s:1.16,x:0,y:3.6}, {s:1.10,x:0,y:-3.6}],
  "tiltD":[{s:1.16,x:0,y:-3.6},{s:1.10,x:0,y:3.6}]
};
var FADE = 0.85, CAP_IN = 0.45, CAP_FADE = 0.55;
var RM = matchMedia('(prefers-reduced-motion:reduce)').matches;

var stage=document.getElementById('stage'), shotsEl=document.getElementById('shots'),
    capsEl=document.getElementById('caps'), filmsEl=document.getElementById('films'),
    noteEl=document.getElementById('note'), fill=document.getElementById('fill'),
    timeEl=document.getElementById('time'), track=document.getElementById('track'),
    pp=document.getElementById('pp'), rs=document.getElementById('rs'), big=document.getElementById('big'),
    subEl=document.getElementById('sub');

var cur=null, shots=[], caps=[], total=0, t=0, playing=false, last=0, raf=0, subIdx=-2;

var ICON_PLAY='<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
var ICON_PAUSE='<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function esc(s){ return s==null ? '' : String(s); }
function mmss(x){ x=Math.max(0,x); var m=Math.floor(x/60), s=Math.floor(x%60); return m+':'+(s<10?'0':'')+s; }

function buildFilm(f){
  shotsEl.innerHTML=''; capsEl.innerHTML=''; shots=[]; caps=[]; total=0; subIdx=-2;
  var hasSub=false;
  f.shots.forEach(function(sh,i){
    var st=total; total+=sh.dur;
    var el=document.createElement('div');
    el.className='shot'; el.style.zIndex=i;
    if(sh.card){
      el.innerHTML='<div class="card">'+
        '<svg class="cmark" width="54" height="54" style="color:var(--champagne)"><use href="#msMark"/></svg>'+
        '<h2>'+esc(sh.card.h)+'</h2><div class="en">'+esc(sh.card.en)+'</div>'+
        '<div class="rule"></div><div class="lines">'+sh.card.lines+'</div></div>';
    } else {
      /* 用 createElement 而非字串拼接：避免產生假的 src="..." 字面值被靜態檢查誤判 */
      var im=document.createElement('img');
      im.alt=''; im.loading=(i<2 ? 'eager' : 'lazy'); im.src=sh.img;
      el.appendChild(im);
    }
    shotsEl.appendChild(el);
    shots.push({el:el, img:el.querySelector('img'), st:st, en:st+sh.dur, kb:KB[sh.kb]||KB["in"], vo:sh.vo||''});
    if(sh.vo) hasSub=true;

    if(sh.cap){
      var c=document.createElement('div');
      c.className='cap '+(sh.cap.pos||'bl');
      c.innerHTML='<div class="capin">'+
        (sh.cap.eyebrow ? '<p class="eyebrow">'+esc(sh.cap.eyebrow)+'</p>' : '')+
        (sh.cap.t ? '<p class="t">'+sh.cap.t+'</p>' : '')+
        (sh.cap.s ? '<p class="s">'+sh.cap.s+'</p>' : '<div class="hair"></div>')+
        '</div>';
      capsEl.appendChild(c);
      caps.push({el:c, box:c.querySelector('.capin'), st:st+CAP_IN, en:st+sh.dur-0.3});
    }
  });
  total+=FADE;
  stage.classList.toggle('has-sub', hasSub);
}

function frame(){
  var i,s,o,p,k,a,b,tr;
  for(i=0;i<shots.length;i++){
    s=shots[i];
    if(t < s.st-0.01 || t > s.en+FADE){
      if(s.el.style.opacity!=='0') s.el.style.opacity='0';
      continue;
    }
    if(i===0)              o=(t < s.en) ? 1 : 1-(t-s.en)/FADE;   /* 首格不淡入，暫停時才有畫面可看 */
    else if(t < s.st+FADE) o=(t-s.st)/FADE;
    else if(t < s.en)      o=1;
    else                   o=1-(t-s.en)/FADE;
    s.el.style.opacity=Math.max(0,Math.min(1,o)).toFixed(3);
    if(s.img){
      p=Math.max(0,Math.min(1,(t-s.st)/(s.en-s.st)));
      k=s.kb; a=k[0]; b=k[1];
      if(RM){
        tr='scale(1.04)';
      } else {
        tr='translate('+(a.x+(b.x-a.x)*p).toFixed(3)+'%,'+(a.y+(b.y-a.y)*p).toFixed(3)+'%) '+
           'scale('+(a.s+(b.s-a.s)*p).toFixed(4)+')';
      }
      s.img.style.transform=tr;
    }
  }
  for(i=0;i<caps.length;i++){
    var c=caps[i], co;
    if(t < c.st || t > c.en+CAP_FADE)  co=0;
    else if(t < c.st+CAP_FADE)         co=(t-c.st)/CAP_FADE;
    else if(t < c.en)                  co=1;
    else                               co=1-(t-c.en)/CAP_FADE;
    co=Math.max(0,Math.min(1,co));
    c.el.style.opacity=co.toFixed(3);
    c.box.style.transform='translateY('+((1-co)*14).toFixed(2)+'px)';
  }

  /* 旁白字幕（純文字）：跟著當前鏡頭切換 */
  var act=-1;
  for(i=0;i<shots.length;i++){ if(t>=shots[i].st && t<shots[i].en){ act=i; break; } }
  if(act!==subIdx){
    subIdx=act;
    var txt=(act>=0) ? shots[act].vo : '';
    if(txt){ subEl.innerHTML='<span></span>'; subEl.firstChild.textContent=txt; subEl.classList.add('on'); }
    else   { subEl.classList.remove('on'); }
  }

  fill.style.width=(total ? (t/total*100) : 0).toFixed(2)+'%';
  timeEl.textContent=mmss(t)+' / '+mmss(total);
}

function tick(now){
  if(!playing) return;
  if(!last) last=now;
  var dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=1/60;          /* 分頁切走再回來不要一次跳掉好幾秒 */
  t += dt;
  if(t>=total){ t=total; frame(); pause(true); return; }
  frame();
  raf=requestAnimationFrame(tick);
}
function play(){
  if(t>=total) t=0;
  playing=true; last=0;
  stage.classList.remove('paused');
  pp.innerHTML=ICON_PAUSE; big.setAttribute('aria-label','暫停');
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(tick);
}
function pause(ended){
  playing=false; cancelAnimationFrame(raf);
  stage.classList.add('paused'); pp.innerHTML=ICON_PLAY;
  big.setAttribute('aria-label', ended ? '重新播放' : '播放');
}
function toggle(){ if(playing) pause(); else play(); }
function seek(x){
  t=Math.max(0,Math.min(total,x)); last=0;
  frame();
}

function load(idx, autoplay){
  cur=FILMS[idx];
  [].forEach.call(filmsEl.children, function(b,i){
    b.setAttribute('aria-selected', i===idx ? 'true' : 'false');
  });
  noteEl.innerHTML='<b>'+cur.name+'</b>　'+cur.len+'　—　'+cur.note;
  pause(); buildFilm(cur); t=0; frame();
  stage.classList.add('loading');

  var imgs=cur.shots.filter(function(s){ return s.img; }).map(function(s){ return s.img; });
  var left=imgs.length, done=false;
  function go(){
    if(done) return;
    done=true; stage.classList.remove('loading');
    if(autoplay!==false) play();
  }
  if(!left){ go(); return; }
  imgs.forEach(function(src){
    var im=new Image();
    im.onload=im.onerror=function(){ if(--left<=0) go(); };
    im.src=src;
  });
  setTimeout(go, 6000);   /* 保險：素材慢也不會卡住 */
}

FILMS.forEach(function(f,i){
  var b=document.createElement('button');
  b.type='button'; b.setAttribute('role','tab'); b.textContent=f.name;
  b.onclick=function(){ load(i,true); };
  filmsEl.appendChild(b);
});

pp.onclick=function(e){ e.stopPropagation(); toggle(); };
big.onclick=function(e){ e.stopPropagation(); toggle(); };
rs.onclick=function(e){ e.stopPropagation(); seek(0); play(); };
stage.onclick=function(){ toggle(); };
track.onclick=function(e){
  e.stopPropagation();
  var r=track.getBoundingClientRect();
  seek((e.clientX-r.left)/r.width*total);
};
document.addEventListener('keydown', function(e){
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  else if(e.code==='ArrowRight') seek(t+5);
  else if(e.code==='ArrowLeft')  seek(t-5);
});
if(matchMedia('(hover:none)').matches) stage.classList.add('touch');

var wasPlaying=false;
if('IntersectionObserver' in window){
  new IntersectionObserver(function(es){
    var vis=es[0].isIntersecting;
    if(!vis && playing){ wasPlaying=true; pause(); }
    else if(vis && wasPlaying && t<total){ wasPlaying=false; play(); }
  }, {threshold:0.25}).observe(stage);
}

var hidPlaying=false;
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ if(playing){ hidPlaying=true; pause(); } }
  else if(hidPlaying && t<total){ hidPlaying=false; play(); }
});

load(0, true);
})();
</script>
