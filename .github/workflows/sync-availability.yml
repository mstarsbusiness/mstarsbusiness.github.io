name: 名額同步（CRM → 官網）

# 2026-11-19 老闆同意：官網「世貿館借址尚有名額／額滿可候補」改由 CRM 名額自動決定（單一來源）。
#   每天台灣 08:40、14:40 讀 CRM（/.netlify/functions/site-status），名額狀態有變才改檔、提交、觸發 FTP 部署。
#   CRM 讀不到＝不改任何檔（官網維持原樣）。說明與手動用法見 工具_名額同步.js 檔頭。
#   ⚠️ 這支會提交到 main：用 GitHub Desktop 推送前若提示要先 Pull，按 Pull 即可（只會改名額那幾句）。
on:
  schedule:
    - cron: '40 0 * * *'    # 台灣 08:40
    - cron: '40 6 * * *'    # 台灣 14:40
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 讀 CRM 名額並同步官網文字
        id: sync
        run: node 工具_名額同步.js --apply

      - name: 提交（若有變更）
        id: commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' 'en/*.html' llms.txt
          if git diff --cached --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore: 名額同步（世貿館借址 → ${{ steps.sync.outputs.target }}）[skip ci]"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "main 剛好有新提交，先接上最新版再推（第 $i 次）"
            git pull --rebase origin main || { git rebase --abort; break; }
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo "推送失敗"; exit 1; fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # 用內建 token 推的提交不會叫醒 deploy.yml，所以主動觸發（同 build-journal.yml 做法）
      - name: 觸發 FTP 部署（deploy.yml）
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
