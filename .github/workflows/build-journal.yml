name: 自動重生 Journal 與貼文頁

# 當 CMS 發文（更新 data/posts.json）或上傳貼文圖片時自動執行
on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'images/uploads/**'
      - 'build-journal.js'
  workflow_dispatch:   # 也可以在 Actions 分頁手動按一下執行

# contents:write → 可提交重生檔；actions:write → 可主動觸發 deploy.yml（FTP 部署）
permissions:
  contents: write
  actions: write

concurrency:
  group: build-journal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 產生 journal.html、posts/、sitemap.xml
        run: node build-journal.js

      - name: 提交重生後的檔案（若有變更）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal.html sitemap.xml posts
          if git diff --cached --quiet; then
            echo "沒有變更，略過提交。"
          else
            git commit -m "chore: 自動重生 journal 與貼文頁 [skip ci]"
            git push
          fi

      # ★ 關鍵修正（2026-08-03）：github-actions[bot] 用內建 token 推的 commit 不會叫醒
      #   deploy.yml，故重生後「主動」呼叫 deploy.yml 的 workflow_dispatch 觸發 FTP 部署。
      #   （這一步本身不加 [skip ci]，且需上方 permissions: actions: write。）
      - name: 觸發 FTP 部署（deploy.yml）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
